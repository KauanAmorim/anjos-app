name: Reutilizável - Build & Test

on:
  workflow_call:
    inputs:
      java-version:
        description: "Versão do JDK"
        type: string
        default: "21"
      run-integration-tests:
        description: "Se true, roda também os testes de integração (mvn verify)"
        type: boolean
        default: false
      run-docker-build:
        description: "Se true, valida o build da imagem Docker"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Contexto da execução
        run: |
          echo "Evento......: ${{ github.event_name }}"
          echo "Repositório.: ${{ github.repository }}"
          echo "Ref.........: ${{ github.ref }}"
          echo "Base (PR)...: ${{ github.base_ref }}"
          echo "Head (PR)...: ${{ github.head_ref }}"

      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      - name: Executar testes unitários
        run: ./mvnw -B -ntp clean test

  integration-tests:
    name: Testes de integração
    if: inputs.run-integration-tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      - name: Executar testes de integração
        run: ./mvnw -B -ntp verify

  build-image:
    name: Build da imagem Docker
    if: inputs.run-docker-build
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Build da imagem
        run: docker build -t anjos-app:${{ github.sha }} .
