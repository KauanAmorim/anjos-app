name: CI - Main
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1} → main', github.event.number, github.head_ref)
      || format('Release em main · @{0}', github.actor) }}

on:
  push:
    branches:
      - main

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar:
    name: Validação
    uses: ./.github/workflows/buildTest.yaml
    with:
      run-integration-tests: false
      run-docker-build: true

  deploy-prod:
    name: Deploy para produção
    needs: validar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Placeholder
        run: echo "Publicar imagem no registry e subir em produção."
