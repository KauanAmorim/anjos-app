name: CD - Main
run-name: "Deploy Produção · @${{ github.actor }}"

on:
  push:
    branches:
      - main

concurrency:
  group: cd-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar:
    name: Validação
    uses: ./.github/workflows/buildTest.yaml
    with:
      run-integration-tests: true
      run-docker-build: true

  release-please:
    name: Release Please
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: maven
          target-branch: main

  publish-image:
    name: Build e push da imagem versionada
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Baixar o código na tag da release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Gerar metadados (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anjos-app
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gerar attestation de proveniência
        uses: actions/attest@v4
        with:
          subject-name: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/anjos-app
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-prod:
    name: Deploy para produção
    needs: [release-please, publish-image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Placeholder
        run: echo "Subindo a imagem ${{ needs.release-please.outputs.tag_name }} em produção."