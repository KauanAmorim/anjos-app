name: CI - Main
run-name: "Deploy Produção · @${{ github.actor }}"

on:
  push:
    branches:
      - main

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar:
    name: Validação
    uses: ./.github/workflows/buildTest.yaml
    with:
      run-integration-tests: true
      run-docker-build: true

  deploy-prod:
    name: Deploy para produção
    needs: validar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Placeholder
        run: echo "Publicar imagem no registry e subir em produção."
