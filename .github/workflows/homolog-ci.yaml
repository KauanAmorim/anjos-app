name: CI - Homolog
run-name: "Validação Homolog · @${{ github.actor }}"

on:
  pull_request:
    branches:
      - homolog

concurrency:
  group: homolog-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar:
    name: Validação
    uses: ./.github/workflows/buildTest.yaml
    with:
      run-integration-tests: true
      run-docker-build: true
