name: CI - Homolog
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1} → homolog', github.event.number, github.head_ref)
      || format('Merge em homolog · @{0}', github.actor) }}

on:
  # 1) Abertura/atualização de PR cuja BASE é homolog (vindo de feat/*, fix/* ...)
  pull_request:
    branches:
      - homolog
  # 2) Push direto em homolog — na prática, o merge do PR acima.
  push:
    branches:
      - homolog

# Os dois gatilhos acima nunca disparam ao mesmo tempo:
# o PR vem de uma branch de feature, e o push em homolog só ocorre no merge.

concurrency:
  group: ci-homolog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar:
    name: Validação
    uses: ./.github/workflows/_build-test.yaml
    with:
      run-unit-tests: true
      run-integration-tests: true
      run-docker-build: true

  deploy-homolog:
    name: Deploy para homologação
    needs: validar
    # Só roda DEPOIS do merge, nunca na validação do PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: homolog
    steps:
      - name: Placeholder
        run: echo "Publicar imagem no registry e subir no ambiente de homologação."