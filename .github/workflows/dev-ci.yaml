name: CI - Branch de desenvolvimento
run-name: "CI dev · ${{ github.ref_name }} · @${{ github.actor }}"

on:
  push:
    branches-ignore:
      - main
      - homolog

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar:
    name: Validação
    uses: ./.github/workflows/buildTest.yaml
    with:
      run-integration-tests: false
      run-docker-build: true
