name: CI - Main
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1} → main', github.event.number, github.head_ref)
      || format('Release em main · @{0}', github.actor) }}

on:
  # 1) PR cuja BASE é main (normalmente vindo de homolog, ou de hotfix/*)
  pull_request:
    branches:
      - main
  # 2) Push direto em main — o merge do PR acima.
  push:
    branches:
      - main

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.ref }}
  # Em main, não cancelamos execuções em andamento: um deploy pela metade
  # é pior do que gastar alguns minutos a mais.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar:
    name: Validação
    uses: ./.github/workflows/_build-test.yaml
    with:
      run-unit-tests: true
      run-integration-tests: true
      run-docker-build: true

  deploy-prod:
    name: Deploy para produção
    needs: validar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Placeholder
        run: echo "Publicar imagem no registry e subir em produção."