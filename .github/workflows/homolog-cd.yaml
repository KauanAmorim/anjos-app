name: CI - Homolog
run-name: "Deploy Homolog · @${{ github.actor }}"

on:
  push:
    branches:
      - homolog

concurrency:
  group: homolog-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar:
    name: Validação
    uses: ./.github/workflows/buildTest.yaml
    with:
      run-integration-tests: true
      run-docker-build: true

  deploy-homolog:
    name: Deploy para homologação
    needs: validar
    runs-on: ubuntu-latest
    environment: homolog
    steps:
      - name: Placeholder
        run: echo "Publicar imagem no registry e subir no ambiente de homologação."
