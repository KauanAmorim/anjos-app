name: CD - Homolog
run-name: "Deploy Homolog · @${{ github.actor }}"

on:
  push:
    branches:
      - homolog

concurrency:
  group: cd-homolog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar:
    name: Validação
    uses: ./.github/workflows/buildTest.yaml
    with:
      run-integration-tests: true
      run-docker-build: true

  publish-image:
    name: Build e push da imagem versionada
    needs: validar
    runs-on: ubuntu-latest
    environment: homolog
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Gerar metadados (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anjos-app
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=homolog

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build e push da imagem
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gerar attestation de proveniência
        uses: actions/attest@v4
        with:
          subject-name: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/anjos-app
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Placeholder do Cloud Run
        run: echo "Imagem homolog e sha publicadas. Próximo passo seria o gcloud run deploy..."

  deploy-homolog:
    name: Deploy para homologação
    needs: validar
    runs-on: ubuntu-latest
    environment: homolog
    steps:
      - name: Placeholder
        run: echo "Publicar imagem no registry e subir no ambiente de homologação."
